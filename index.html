<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ҳисобкунаки даромад</title>
    <style>
        :root {
            --gold: #FFD700;
            --gold-dim: #B8960F;
            --bg: #0a0a0a;
            --bg-card: #141414;
            --bg-hover: #1e1e1e;
            --text: #ffffff;
            --text-dim: #888888;
            --border: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--gold);
            transition: width 0.5s ease;
            z-index: 100;
        }

        /* Container */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .header p {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Step container */
        .step {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .step.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-option {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 12px;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-option:hover {
            border-color: var(--gold);
            background: var(--bg-hover);
        }
        .btn-option:active {
            transform: scale(0.97);
        }
        .btn-option .label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
            font-weight: 400;
        }

        /* CTA buttons */
        .cta-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-cta {
            border: none;
            border-radius: 12px;
            padding: 18px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-cta:active { transform: scale(0.97); }
        .btn-cta-yes {
            background: var(--gold);
            color: #000;
        }
        .btn-cta-no {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .btn-cta-no:hover {
            border-color: var(--gold);
            color: var(--text);
        }

        /* Result card */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: var(--text-dim); font-size: 14px; }
        .result-value { font-weight: 700; font-size: 16px; }
        .result-value.gold { color: var(--gold); }
        .result-big {
            text-align: center;
            padding: 20px 0;
        }
        .result-big .amount {
            font-size: 36px;
            font-weight: 800;
            color: var(--gold);
        }
        .result-big .sub {
            color: var(--text-dim);
            font-size: 13px;
            margin-top: 4px;
        }

        /* Mobile */
        @media (max-width: 380px) {
            .btn-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>

    <div class="container">
        <!-- STEP 1: Income Selection -->
        <div class="step active" id="step1">
            <div class="header">
                <div class="icon">💰</div>
                <h1>Ҳисобкунаки даромади шумо</h1>
                <p>Чӣ қадар даромад мехоҳед?</p>
            </div>
            <div class="btn-grid" id="incomeButtons"></div>
        </div>

        <!-- STEP 2: Time Selection -->
        <div class="step" id="step2">
            <div class="header">
                <div class="icon">⏳</div>
                <h1>Интенсивность работы</h1>
                <p id="step2Subtitle">Барои даромад интихоб кунед:</p>
            </div>
            <div class="btn-grid" id="timeButtons"></div>
        </div>

        <!-- STEP 3: Result + CTA -->
        <div class="step" id="step3">
            <div class="header">
                <div class="icon">🎯</div>
                <h1>Натиҷаи шумо</h1>
            </div>

            <div class="result-card">
                <div class="result-big">
                    <div class="amount" id="resultIncome">0 TJS</div>
                    <div class="sub">Даромади шумо дар як рӯз</div>
                </div>
                <div class="result-row">
                    <span class="result-label">⏱️ Формати кор</span>
                    <span class="result-value" id="resultTime">—</span>
                </div>
                <div class="result-row">
                    <span class="result-label">💰 Нархи вуруд</span>
                    <span class="result-value gold" id="resultPrice">— Сомонӣ</span>
                </div>
                <div class="result-row">
                    <span class="result-label">📈 Суръат</span>
                    <span class="result-value" id="resultSpeed">—</span>
                </div>
            </div>

            <p style="text-align:center; color:var(--text-dim); margin-top:24px; font-size:14px;">
                Ин натиҷа ба шумо мувофиқ аст?
            </p>

            <div class="cta-grid">
                <button class="btn-cta btn-cta-yes" onclick="handleCTA('yes')">
                    ✅ ҲА, ОПЛАТА КУНАМ!
                </button>
                <button class="btn-cta btn-cta-no" onclick="handleCTA('no')">
                    ❌ НЕ, НУЖНЫ УСЛОВИЯ
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // КОНФИГУРАЦИЯ
        // ============================================================
        const CONFIG = {
            CAPI_URL: 'http://127.0.0.1:5001/api/send-capi',
            BOT_USERNAME: 'YourBotUsername', // ← ЗАМЕНИ НА РЕАЛЬНЫЙ ЮЗЕРНЕЙМ
            CAPI_TIMEOUT: 3000 // 3 секунды таймаут для CAPI
        };

        // ============================================================
        // МАТРИЦА ДАННЫХ
        // ============================================================
        const MATRIX = [
            { income: 17000, times: [7,6,5,4,3,2], prices: [200,220,240,260,280,300] },
            { income: 18800, times: [7,6,5,4,3,2], prices: [240,260,280,300,320,340] },
            { income: 20600, times: [7,6,5,4,3,2], prices: [280,300,320,340,360,380] },
            { income: 22400, times: [7,6,5,4,3,2], prices: [320,340,360,380,400,420] },
            { income: 24200, times: [7,6,5,4,3,2], prices: [360,380,400,420,440,460] },
            { income: 26000, times: [7,6,5,4,3,2], prices: [400,420,440,460,480,500] }
        ];

        const TIME_LABELS = [
            '🐢 7 соат (Эконом)',
            '6 соат',
            '5 соат',
            '4 соат',
            '3 соат',
            '🐇 2 соат (VIP)'
        ];

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let selectedIncomeIndex = null;
        let selectedTimeIndex = null;
        let ctaSent = false;

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        function init() {
            renderIncomeButtons();
            setProgress(33);
        }

        function renderIncomeButtons() {
            const container = document.getElementById('incomeButtons');
            container.innerHTML = MATRIX.map((item, i) => `
                <button class="btn-option" onclick="selectIncome(${i})">
                    ${formatNumber(item.income)} TJS
                </button>
            `).join('');
        }

        function renderTimeButtons() {
            const income = MATRIX[selectedIncomeIndex].income;
            document.getElementById('step2Subtitle').textContent =
                `Барои ${formatNumber(income)} TJS вақтро интихоб кунед:`;

            const container = document.getElementById('timeButtons');
            container.innerHTML = MATRIX[selectedIncomeIndex].times.map((time, i) => `
                <button class="btn-option" onclick="selectTime(${i})">
                    ${TIME_LABELS[i]}
                </button>
            `).join('');
        }

        // ============================================================
        // ШАГ 1: ВЫБОР ДОХОДА
        // ============================================================
        function selectIncome(index) {
            selectedIncomeIndex = index;
            setProgress(66);
            showStep('step2');
            renderTimeButtons();
        }

        // ============================================================
        // ШАГ 2: ВЫБОР ВРЕМЕНИ
        // ============================================================
        function selectTime(index) {
            selectedTimeIndex = index;
            setProgress(100);
            showResult();
            showStep('step3');
        }

        // ============================================================
        // ШАГ 3: РЕЗУЛЬТАТ
        // ============================================================
        function showResult() {
            const item = MATRIX[selectedIncomeIndex];
            const income = item.income;
            const time = item.times[selectedTimeIndex];
            const price = item.prices[selectedTimeIndex];
            const isVip = time <= 2;

            document.getElementById('resultIncome').textContent = `${formatNumber(income)} TJS`;
            document.getElementById('resultTime').textContent = `${time} соат/рӯз`;
            document.getElementById('resultPrice').textContent = `${price} Сомонӣ`;
            document.getElementById('resultSpeed').textContent = isVip ? 'VIP-суръат' : 'Стандарт';
        }

        // ============================================================
        // CTA: ОТПРАВКА CAPI + РЕДИРект В TELEGRAM
        // ============================================================
        function handleCTA(decision) {
            if (ctaSent) return;
            ctaSent = true;

            const item = MATRIX[selectedIncomeIndex];
            const income = item.income;
            const time = item.times[selectedTimeIndex];
            const price = item.prices[selectedTimeIndex];

            // 1. Отправляем InitiateCheckout в CAPI
            sendCAPIEvent(income, time, price, decision);

            // 2. Редирект в Telegram (параллельно, без ожидания)
            const startParam = `quiz_${decision}_${income}_${time}_${price}`;
            const tgUrl = `https://t.me/${CONFIG.BOT_USERNAME}?start=${startParam}`;

            // Небольшая задержка чтобы CAPI успел улететь
            setTimeout(() => {
                window.location.href = tgUrl;
            }, 300);
        }

        // ============================================================
        // CAPI: ОТПРАВКА СОБЫТИЯ
        // ============================================================
        async function sendCAPIEvent(income, time, price, decision) {
            try {
                const payload = {
                    event_name: 'InitiateCheckout',
                    user_data: {
                        fbc: getCookie('_fbc') || '',
                        fbp: getCookie('_fbp') || '',
                        external_id: generateUniqueId()
                    },
                    custom_data: {
                        value: price,
                        currency: 'TJS',
                        content_name: 'quiz_matrix',
                        decision: decision,
                        income_target: income,
                        time_hours: time
                    },
                    source: 'landing'
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.CAPI_TIMEOUT);

                const response = await fetch(CONFIG.CAPI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    console.log('✅ CAPI InitiateCheckout sent:', decision);
                } else {
                    console.warn('⚠️ CAPI error:', response.status);
                }
            } catch (err) {
                // НЕ БЛОКИРУЕМ редирект! Логируем и продолжаем.
                console.warn('⚠️ CAPI unavailable (non-critical):', err.message);
            }
        }

        // ============================================================
        // УТИЛИТЫ
        // ============================================================
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return '';
        }

        function generateUniqueId() {
            return 'uid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        function setProgress(percent) {
            document.getElementById('progressBar').style.width = percent + '%';
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================
        init();
    </script>
</body>
</html>
