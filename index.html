.page-background {
overflow: auto;

width: 100%;
position: fixed;

.content-container {

.profile-card {

.profile-image {

.profile-name {

.verified-icon {

.profile-subscribers {

.profile-description {

.additional-text {

margin-top: 24px;

color: #7d7f81;
padding: 0 16px;
text-align: center;

@media (max-width: 480px) {
