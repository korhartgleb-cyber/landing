<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RFX Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 15px;
            color: #fff;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .metric-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }
        
        .metric-card.profit .metric-value {
            color: #10b981;
        }
        
        .metric-card.cpl .metric-value.good {
            color: #10b981;
        }
        
        .metric-card.cpl .metric-value.bad {
            color: #ef4444;
        }
        
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 25px 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .main-card h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        
        .status-row:last-child {
            border-bottom: none;
        }
        
        .status-label {
            font-size: 14px;
            color: #666;
        }
        
        .status-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .status-value.good {
            color: #10b981;
        }
        
        .status-value.bad {
            color: #ef4444;
        }
        
        .refresh-info {
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 16px;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }
        
        @media (max-width: 380px) {
            .metric-value {
                font-size: 24px;
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 RFX Dashboard</h1>
        <p id="lastUpdate">Обновление...</p>
    </div>

    <div id="content">
        <div class="loading">⏳ Загрузка данных...</div>
    </div>

    <div class="refresh-info">
        🔄 Автообновление каждые 5 минут
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ (ТВОИ ДАННЫЕ)
        // ==========================================
        const SHEET_ID = '1o_yf3XpdIy-IwHqjLoEwiVMoUiLy0c-HUFydfaIYvIk';
        const API_KEY = 'AIzaSyBlYUrHPzhA2q6sVhXnV04qgrfldJAlBWU';
        
        // ==========================================
        // ФУНКЦИИ
        // ==========================================
        async function fetchData() {
            try {
                // Запрашиваем данные из Google Sheets (вкладка DASHBOARD, ячейки B2:B15)
                const response = await fetch(
                    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/DASHBOARD!B2:B15?key=${API_KEY}`
                );
                
                if (!response.ok) {
                    throw new Error('Ошибка доступа к таблице');
                }
                
                const data = await response.json();
                const values = data.values || [];
                
                // Парсим данные из таблицы
                // B2: Дата, B3: пусто, B4: Spent, B5: пусто, B6: Leads, B7: CPL, 
                // B8: Deposits, B9: Commissions, B10: пусто, B11: пусто, B12: Profit
                const metrics = {
                    date: values[0]?.[0] || 'N/A',                    // B2
                    spent: parseFloat(values[2]?.[0]) || 0,           // B4
                    leads: parseInt(values[4]?.[0]) || 0,             // B6
                    cpl: parseFloat(values[5]?.[0]) || 0,             // B7
                    deposits: parseInt(values[7]?.[0]) || 0,          // B9
                    commissions: parseFloat(values[8]?.[0]) || 0,     // B10
                    profit: parseFloat(values[11]?.[0]) || 0          // B13
                };
                
                renderDashboard(metrics);
                updateTimestamp();
                
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось загрузить данные. Проверь подключение.');
            }
        }
        
        function renderDashboard(data) {
            const cplClass = data.cpl > 5 ? 'bad' : 'good';
            const cplStatus = data.cpl > 5 ? '⚠️ Выше нормы' : '✅ В норме';
            
            const html = `
                <div class="metrics-grid">
                    <div class="metric-card profit">
                        <div class="metric-label">Профит</div>
                        <div class="metric-value">$${data.profit.toLocaleString()}</div>
                    </div>
                    <div class="metric-card cpl">
                        <div class="metric-label">CPL</div>
                        <div class="metric-value ${cplClass}">$${data.cpl.toFixed(2)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Потрачено</div>
                        <div class="metric-value">$${data.spent.toLocaleString()}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Лиды</div>
                        <div class="metric-value">${data.leads}</div>
                    </div>
                </div>
                
                <div class="main-card">
                    <h2>📊 Детали</h2>
                    <div class="status-row">
                        <span class="status-label">📅 Дата</span>
                        <span class="status-value">${data.date}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">💰 Депозиты</span>
                        <span class="status-value">${data.deposits}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">💵 Комиссии</span>
                        <span class="status-value">$${data.commissions.toLocaleString()}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">🎯 CPL статус</span>
                        <span class="status-value ${cplClass}">${cplStatus}</span>
                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    ❌ ${message}
                </div>
            `;
        }
        
        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            document.getElementById('lastUpdate').textContent = 
                `Обновлено: ${timeString}`;
        }
        
        // ==========================================
        // ЗАПУСК
        // ==========================================
        fetchData();
        
        // Автообновление каждые 5 минут (300000 мс)
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
